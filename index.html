<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <title>Project</title>

<style>
    body {
        background-image: url(https://i.pinimg.com/736x/84/ca/85/84ca855ba3b132a749d084e7793c1662.jpg);
        background-size: cover;
        background-repeat: no-repeat;
        background-position: fixed;
        margin: 0%;
        padding: 0%;
        font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
    }

    /* Nav-bar code from W3Schools */
    ul {
        list-style-type: none;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #ffffff;
    }

    ul li {
        float: left;
    }

    ul li a {
        display: block;
        color: rgb(223, 120, 154);
        text-align: center;
        padding: 17px 19px;
        text-decoration: none;
        font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
    }

    ul li a:hover {
        background-color: rgb(255, 244, 246);
    }

    h1{
        font-size: 38px;
        font-weight: bold;
        text-align: center;
        color: rgb(223, 120, 154);
        background-color: white;
        border-radius: 25px;
        display: block;
        width: fit-content;
        margin: 40px auto 0 auto;
        padding: 10px 25px;
    }

    .row {
        display: flex;
        justify-content: center;
        align-items: flex-start;
        gap: 50px;
        margin-top: 30px;
    }

    #menu {
        text-align: center;
        font-size: 20px;
    }

    .container {
        display: flex;
        justify-content: center;
        gap: 50px;
    }

    .Products {
        background-color:white;
        color: rgb(223, 120, 154);
        font-size: 25px;
        padding: 18px;
        border-radius: 25px;
        width: 400px;
        text-align: left;
        font-weight: bold;
    }

    h4 {
        text-align: center;
        color: rgb(223, 120, 154);
        font-size: 22px;
    }

    input[type="button"] {
        margin-top: 15px;
        padding: 8px 25px;
        background-color: rgb(223, 120, 154);
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
    }

    h2 {
        text-align: center;
        color: rgb(223, 120, 154);
        margin-top: 0;
    }

    #result {
        background-color:white;
        color: rgb(223, 120, 154);
        font-size: 25px;
        width: 400px;
        padding: 20px;
        border-radius: 25px;
        text-align: left;
    }

    #receipt{
        text-align: center;
        font-size: 20px;
    }

</style>
</head>

<body>

<ul>
    <li><a href="index.html"><b>Receipt Generator</b></a></li>
    <li><a href=""><b>SKU Generator</b></a></li>
</ul>

<div class="h1container">
    <h1><b>Slimes and Squishies Shop</b></h1>
 </div>

<div class="row">

    <!-- MENU -->
    <div id="menu">
        <h3 style="color:  rgb(173, 82, 112);">MENU</h3>

        <div class="container">
            <div class="Products">
                <h4 style="font-size:30px; text-align: left; color: rgb(173, 82, 112); margin: 2px;"><b>Slime</b></h4>
                <label> <input type="checkbox" value="160" id="slime1">Cookie Dough Slime</label><br>
                <label><input type="checkbox" value="165" id="slime2">Cotton Candy Slime</label><br>
                <label><input type="checkbox" value="155" id="slime3">Honey Gloss Slime</label><br>
                <br>

                <h4 style="font-size: 30px; text-align: left; color:rgb(173, 82, 112); margin: 2px;"><b>Squishies</b></h4>
                <label><input type="checkbox" value="60" id="squishy1">Needoh Squishy</label><br>
                <label> <input type="checkbox" value="50" id="squishy2">Cheese Squishy</label><br>
                <label><input type="checkbox" value="45" id="squishy3">Coconut Oil Squishy</label><br>
                <input type="button" py-click="Total" value="Add">
                <input type="button" py-click="Reset" value="Cancel">
            </div>
        </div>
    </div>

    <div id="receipt">
        <h3 style="color:  rgb(173, 82, 112);">RECEIPT DETAILS</h3>

        <div id="result">
            <p><b>Subtotal:</b> ₱0.00</p>
            <p><b>Tax:</b> ₱0.00</p>
            <p><b>Total:</b> ₱0.00</p>
        </div>
    </div>
</div>

<py-script src="main.py"></py-script>

</body>
</html>
