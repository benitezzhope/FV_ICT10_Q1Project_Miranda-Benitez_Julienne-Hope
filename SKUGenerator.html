<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICT SKU Generator</title>
      <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
<script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

</head>
<body>
<style>

body {
        margin: 0;
            padding: 0;
            width: 100%;
            background-image: url(https://i.pinimg.com/736x/84/ca/85/84ca855ba3b132a749d084e7793c1662.jpg);
            background-size: cover;
            background-repeat: no-repeat;
            background-position: fixed;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
    }

/* Nav-bar code from w3schools */
ul {
  list-style-type: none; 
  margin: 0;
  padding: 0;
  overflow: hidden;
  background-color:  #ffffff;
}

ul li {
  float: left;
}

ul li a:hover {
  background-color: rgb(255, 244, 246)
}

ul li a {
  display: block;
  color: rgb(223, 120, 154);
  text-align: center;
  padding: 17px 19px;
  text-decoration: none;
  font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif
}

.skew1{
    margin: auto;
}
#skew2{
    background-color: #fffcfd;
    width: 400px;
    height: 500px;
    border: none;
    border-radius: 10px;
    margin-top: 90px; 
    width: 600px; 
    height: 550px; 
    border-radius: 40px; 
    box-shadow: rgba(0, 0, 0, 0.1) 0px 4px 12px;
}

select {
    width: 93%;
    padding: 14px;
    font-size: 15px; 
    border-radius: 8px; 
    font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
    color: rgb(101, 101, 101);
    margin-left: 20px;
    border: 1px solid #cecece; 
    outline: none;
}

input {
    width: 88%;
    padding: 14px;
    font-size: 15px; 
    border-radius: 8px; 
    font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
     color:  rgb(101, 101, 101);
    margin-left: 20px;
    border: 1px solid #cecece; 
    outline: none;
}

input::placeholder {
    color: rgb(187, 187, 187) !important;
    opacity: 1 !important;
}
  .skugen{
    display: block;
    margin: 15px auto;
    padding: 10px 10px;
    background-color: #ff71a3;
    border: none;
    border-radius: 10px;
    color: rgb(255, 255, 255);
    text-align: center;
    font-size: 15px;
    cursor: pointer;
    font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
    width: 290px;
    box-shadow: rgba(0, 0, 0, 0.1) 0px 4px 12px;
}
</style>
<ul>
  <li><a href="index.html"><b>Receipt Generator</b></a></li>
  <li><a href="SKUGenerator.html"><b>SKU Generator</b></a></li>
</ul>

<div class="skew1" id="skew2">
<br>
<h1 style="color: #ff71a3; text-align: center;">SKU Generator</h1>

<div>
<label for="category" style="font-size: 20px; color: #ffb5cf; padding-left: 20px;"><b>Category</b></label>
<select id="category" name="category" placeholder="Ex. Cookie Dough Slime"style="margin-top: 10px;">
 
  <option value="" disabled selected hidden>Choose a category...</option> <!--placeholder that disappears after selecting-->
  <option value="slime">Slime</option>
  <option value="squishy">Squishy</option>

</select>
</div>

<br>

<div>
<label for="product" style="font-size: 20px; color: #ffb5cf; padding-left: 20px;"><b>Product Name</b></label>
  <input type="text" id="product" name="product" placeholder="Ex. Cookie Dough Slime" style="margin-top: 10px;">
</div>

<br>

<div>
        <label for="quantity" style="font-size: 20px; color: #ffb5cf; padding-left: 20px;"><b>Product Quantity</b></label>
        <input type="number" id="quantity" name="quantity" placeholder="Ex. 38" min="1" style="margin-top: 10px;">
</div>

<br>

<input type="button" py-click="skugen" value="Get Your SKU-Code" class="skugen"> 
<div id="skugen" style="padding-top: 5px;"></div>

<py-script src="main.py"></py-script>
   
</div>

</body>
</html>
